                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [videos]); // Re-add listener if videos change

            return (
                <div 
                    ref={modalRef}
                    role="dialog" 
                    aria-modal="true" 
                    aria-labelledby="video-modal-title"
                    tabIndex={-1}
                    className={`fixed inset-0 bg-black/80 backdrop-blur-xl z-[9999] flex items-center justify-center ${animationState === 'entering' ? 'modal-bg-enter' : 'modal-bg-exit'}`} 
                    onClick={handleClose}
                    onTouchStart={onTouchStart}
                    onTouchMove={onTouchMove}
                    onTouchEnd={onTouchEnd}
                >
                    <h2 id="video-modal-title" className="sr-only">Video player</h2>
                    <div className={`relative w-full max-w-4xl p-4 ${animationState === 'entering' ? 'modal-content-enter' : 'modal-content-exit'}`} onClick={e => e.stopPropagation()}>
                        <div className="aspect-video bg-black rounded-lg overflow-hidden">
                            <iframe key={video.id} width="100%" height="100%" src={`https://www.youtube.com/embed/${video.videoId}?autoplay=1&rel=0&modestbranding=1`} title="Embedded YouTube video player" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe>
                        </div>
                    </div>
                    <button type="button" ref={closeBtnRef} onClick={handleClose} aria-label="Close video player" className="absolute top-6 right-6 text-white/70 hover:text-white hover:scale-110 transform transition-all duration-300"><X size={32} /></button>
                    {videos.length > 1 && (
                        <>
                            <button type="button" onClick={e => { e.stopPropagation(); changeVideo(-1); }} aria-label="Previous video" className="absolute left-6 text-white/70 hover:text-white hover:scale-110 transform transition-all duration-300"><ChevronLeft size={48} /></button>
                            <button type="button" onClick={e => { e.stopPropagation(); changeVideo(1); }} aria-label="Next video" className="absolute right-6 text-white/70 hover:text-white hover:scale-110 transform transition-all duration-300"><ChevronRight size={48} /></button>
                        </>
                    )}
                </div>
            );
        };


        // {/* =======================================================
        // --- MAIN APP COMPONENT (RE-ENGINEERED) ---
        // This is the root component that manages the state for the entire application.
        // ======================================================= */}
        function App() {
            const [loadingState, setLoadingState] = useState('loading');
            const [activeSection, setActiveSection] = useState('home');
            const [galleryType, setGalleryType] = useState(null);
            const [selectedImage, setSelectedImage] = useState(null);
            const [selectedVideo, setSelectedVideo] = useState(null);

            useEffect(() => {
                const exitTimer = setTimeout(() => setLoadingState('exiting'), 2500);
                const finishTimer = setTimeout(() => setLoadingState('finished'), 3500);
                return () => {
                    clearTimeout(exitTimer);
                    clearTimeout(finishTimer);
                };
            }, []);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    entries => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) setActiveSection(entry.target.id);
                        });
                    },
                    { rootMargin: '-40% 0px -60% 0px' }
                );
                document.querySelectorAll('section[id]').forEach(section => observer.observe(section));
                return () => observer.disconnect();
            }, []);

            const navigateTo = (e, sectionId) => {
                if (e) e.preventDefault();
                // If a modal is open, do not scroll the main page.
                if (galleryType || selectedImage || selectedVideo) {
                    return;
                }
                const element = document.getElementById(sectionId);
                if (element) {
                    const navbarHeight = 80; // Height of fixed navbar
                    const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
                    const offsetPosition = elementPosition - navbarHeight;
                    
                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                }
            };

            // Scroll to hash on load after initial animations
            useEffect(() => {
                if (loadingState === 'finished' && window.location.hash) {
                    const sectionId = window.location.hash.replace('#', '');
                    const element = document.getElementById(sectionId);
                    if (element) {
                        const navbarHeight = 80;
                        const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
                        const offsetPosition = elementPosition - navbarHeight;
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                    }
                }
            }, [loadingState]);

            const openGallery = (type) => {
                setGalleryType(type);
            };

            const closeGallery = () => {
                setGalleryType(null);
            };

            const openImageModal = (image, allImages) => {
                setSelectedImage({ images: allImages, currentIndex: allImages.findIndex(img => img.id === image.id) });
            };

            const closeImageModal = () => {
                setSelectedImage(null);
            };

            const openVideoModal = (video) => {
                const allVideos = portfolioData.films;
                setSelectedVideo({ videos: allVideos, currentIndex: allVideos.findIndex(v => v.id === video.id) });
            };

            const closeVideoModal = () => {
                setSelectedVideo(null);
            };

            useEffect(() => {
                const body = document.body;
                const header = document.querySelector('header');
                const main = document.querySelector('main');
                const footer = document.querySelector('footer');
                const scrollToTopBtn = document.getElementById('scroll-to-top-button');
                const isModalOpen = galleryType || selectedImage || selectedVideo;

                const setInert = (el, inert) => {
                    if (!el) return;
                    if (inert) {
                        el.setAttribute('inert', '');
                        el.setAttribute('aria-hidden', 'true');
                    } else {
                        el.removeAttribute('inert');
                        el.removeAttribute('aria-hidden');
                    }
                };

                if (isModalOpen) {
                    const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
                    body.style.overflow = 'hidden';
                    body.style.paddingRight = `${scrollbarWidth}px`;
                    if (header) header.style.paddingRight = `${scrollbarWidth}px`;
                    if (scrollToTopBtn) scrollToTopBtn.style.marginRight = `${scrollbarWidth}px`;
                    setInert(header, true);
                    setInert(main, true);
                    setInert(footer, true);
                } else {
                    body.style.overflow = 'auto';
                    body.style.paddingRight = '0px';
                    if (header) header.style.paddingRight = '0px';
                    if (scrollToTopBtn) scrollToTopBtn.style.marginRight = '0px';
                    setInert(header, false);
                    setInert(main, false);
                    setInert(footer, false);
                }

                return () => {
                    body.style.overflow = 'auto';
                    body.style.paddingRight = '0px';
                    if (header) header.style.paddingRight = '0px';
                    if (scrollToTopBtn) scrollToTopBtn.style.marginRight = '0px';
                    setInert(header, false);
                    setInert(main, false);
                    setInert(footer, false);
                };
            }, [galleryType, selectedImage, selectedVideo]);

            return (
                <React.Fragment>
                    {loadingState !== 'finished' && <LoadingScreen loadingState={loadingState} />}
                    <Navigation activeSection={activeSection} navigateTo={navigateTo} />
                    
                    <main>
                        <HomeSection isReady={loadingState === 'finished'} />
                        <SectionWrapper id="events"><EventsSection openGallery={openGallery} /></SectionWrapper>
                        <SectionWrapper id="about"><AboutSection /></SectionWrapper>
                        <SectionWrapper id="book-now"><ContactSection /></SectionWrapper>
                    </main>

                    <Footer />
                    <ScrollToTopButton />

                    {galleryType && <EventDetailView galleryType={galleryType} close={closeGallery} openImageModal={openImageModal} openVideoModal={openVideoModal} />}
                    {selectedImage && <ImageModal selected={selectedImage} onClose={closeImageModal} />}
                    {selectedVideo && <VideoModal selected={selectedVideo} onClose={closeVideoModal} />}
                </React.Fragment>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
